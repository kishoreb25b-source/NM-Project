<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraft - AI Comic Story Creator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f6f0ff, #eef7ff);
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 17px;
        }

        .section {
            margin-top: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea,
        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        textarea:focus,
        input:focus,
        select:focus {
            outline: none;
            border-color: #7b61ff;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: #7b61ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6247e8;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎨 ComicCraft</h1>

        <p>
            Create your own AI-powered comic story
            with Gemini and generative AI.
        </p>
    </div>

    <form action="/generate" method="post" onsubmit="showLoading()">

        <div class="section">
            <label for="story">
                📝 Enter Your Story
            </label>

            <textarea
                id="story"
                name="story"
                placeholder="Write your story here..."
                required
            ></textarea>
        </div>


        <div class="section">
            <label for="character">
                👤 Main Character Name
            </label>

            <input
                type="text"
                id="character"
                name="character"
                placeholder="Example: Maya"
                required
            >
        </div>


        <div class="section">
            <label for="setting">
                📍 Setting
            </label>

            <input
                type="text"
                id="setting"
                name="setting"
                placeholder="Example: Magical Library"
                required
            >
        </div>


        <div class="section">
            <label for="tone">
                🎭 Story Tone
            </label>

            <select id="tone" name="tone">

                <option value="Adventure">
                    Adventure
                </option>

                <option value="Funny">
                    Funny
                </option>

                <option value="Fantasy">
                    Fantasy
                </option>

                <option value="Mystery">
                    Mystery
                </option>

                <option value="Emotional">
                    Emotional
                </option>

            </select>
        </div>


        <div class="section">
            <label for="art_style">
                🎨 Art Style
            </label>

            <select id="art_style" name="art_style">

                <option value="Digital Comic Art">
                    Digital Comic Art
                </option>

                <option value="Anime">
                    Anime
                </option>

                <option value="Cartoon">
                    Cartoon
                </option>

                <option value="Manga">
                    Manga
                </option>

                <option value="Watercolor">
                    Watercolor
                </option>

            </select>
        </div>


        <div class="button-container">
            <button type="submit" id="generateButton">
    ✨ Generate My Comic
</button>

<p
    id="loadingMessage"
    style="display: none; text-align: center; margin-top: 20px; color: #666;"
>
    ⏳ Creating your comic... This may take a few moments.
</p>
        </div>

    </form>

    <div class="footer">
        Powered by Gemini & Generative AI
    </div>

</div>
<script>
    function showLoading() {
        document.getElementById("loadingMessage").style.display = "block";

        const button = document.getElementById("generateButton");
        button.disabled = true;
        button.innerText = "⏳ Creating Comic...";
    }
</script>
</body>
</html>
